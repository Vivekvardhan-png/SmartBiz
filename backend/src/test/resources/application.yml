spring:
  # Use H2 in-memory database for all tests.
  # Flyway is disabled in tests - schema is managed by Hibernate's create-drop.
  datasource:
    url: jdbc:h2:mem:smartbiz_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=USER,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    # H2Dialect is auto-detected; specify platform to suppress dialect deprecation warning
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false

  flyway:
    enabled: false

cors:
  allowed-origins: http://localhost:5173

security:
  jwt:
    # Test-only ephemeral signing key (>= 32 bytes)
    secret: "test-only-signing-secret-not-for-production-use-64-bytes-minimum!!"
    expiration-seconds: 3600

forecasting:
  service:
    enabled: false
    base-url: http://localhost:8001
    api-key: test-internal-key
    connect-timeout-ms: 1000
    read-timeout-ms: 2000

ai:
  assistant:
    enabled: true
    provider-base-url: http://localhost:9999/v1
    api-key: test-ai-key
    model: gpt-4o-mini
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
    max-tool-rounds: 4
    rate-limit-per-minute: 20

automation:
  scheduler:
    enabled: false

logging:
  level:
    com.nexusops: WARN
    org.springframework.security: WARN

