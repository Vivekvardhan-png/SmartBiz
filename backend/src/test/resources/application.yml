spring:
  # Use H2 in-memory database for all tests.
  # Flyway is disabled in tests - schema is managed by Hibernate's create-drop.
  datasource:
    url: jdbc:h2:mem:nexusops_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=USER,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    # H2Dialect is auto-detected; specify platform to suppress dialect deprecation warning
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false

  flyway:
    enabled: false

cors:
  allowed-origins: http://localhost:5173

logging:
  level:
    com.nexusops: WARN
    org.springframework.security: WARN

