spring:
  application:
    name: smartbiz

  # ============================================================
  # Data Source — PostgreSQL
  # All credentials sourced from environment variables.
  # Never hardcode credentials here. See .env.example.
  # ============================================================
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SmartBizHikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Verify connections before handing them to the application.
      connection-test-query: SELECT 1

  # ============================================================
  # JPA / Hibernate
  # Schema management is owned by Flyway. Hibernate only validates.
  # ============================================================
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
        # Use a consistent naming strategy matching SQL conventions.
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        # Log slow queries server-side (not to the client).
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 500
    open-in-view: false
  # ============================================================
  # Flyway — Database Migrations
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false
    validate-on-migrate: true
    # Schema history table prefix makes it identifiable alongside app tables.
    table: flyway_schema_history

# ============================================================
# Spring Boot Actuator — Health & Readiness Probes
# Sensitive details (db credentials, env, heap) are NOT exposed.
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    defaults:
      enabled: true

# ============================================================
# Server
# ============================================================
server:
  port: 8080
  error:
    # Never expose stack traces or whitelabel error pages to clients.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    whitelabel:
      enabled: false

# ============================================================
# SpringDoc / Swagger UI — available in local dev only.
# Restrict or disable in production via profile override.
# ============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

# ============================================================
# CORS — explicit origin allowlist from environment.
# ============================================================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ============================================================
# Security / JWT — secret must come from environment.
# ============================================================
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

# ============================================================
# Forecasting Internal Service (Optional Python microservice)
# ============================================================
forecasting:
  service:
    enabled: ${FORECASTING_ENABLED:false}
    base-url: ${FORECASTING_URL:http://localhost:8001}
    api-key: ${FORECASTING_API_KEY:}
    connect-timeout-ms: ${FORECASTING_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${FORECASTING_READ_TIMEOUT_MS:5000}

# ============================================================
# Controlled AI Assistant & Deterministic Automation (Prompt 07)
# API keys stay strictly server-side; never expose to frontend.
# ============================================================
ai:
  assistant:
    enabled: ${AI_ASSISTANT_ENABLED:false}
    provider-base-url: ${AI_PROVIDER_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_PROVIDER_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:20000}
    max-tool-rounds: ${AI_MAX_TOOL_ROUNDS:4}
    rate-limit-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:20}

automation:
  scheduler:
    enabled: ${AUTOMATION_SCHEDULER_ENABLED:false}
    cron: ${AUTOMATION_SCHEDULER_CRON:0 0 */6 * * *}

# ============================================================
# Logging
# - Log structured INFO in production; DEBUG in local.
# - Never log passwords, tokens, or sensitive business data.
# ============================================================
logging:
  level:
    root: INFO
    com.nexusops: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

